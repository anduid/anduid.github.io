<script>
  (function () {
    try {
      var t = localStorage.getItem('tema');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang';
      document.documentElement.setAttribute('data-tema', t);
    } catch (e) {}
  })();
</script>
