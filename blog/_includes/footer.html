<footer class="kaki">
  <div class="bungkus kaki-isi">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}. Dibangun dengan Jekyll di GitHub Pages.</p>
    <p class="kaki-tautan">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {% if site.github_username != "" %}<a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}
      {% if site.instagram_username != "" %}<a href="https://instagram.com/{{ site.instagram_username }}">Instagram</a>{% endif %}
    </p>
  </div>
</footer>
<script src="{{ '/assets/js/tema.js' | relative_url }}"></script>
