<header class="kepala">
  <div class="bungkus kepala-isi">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, ke beranda blog">
      <img src="{{ '/assets/images/icon-192.png' | relative_url }}" width="34" height="34" alt="" class="logo-tanda">
      <span class="logo-teks">{{ site.title }}</span>
    </a>

    <nav id="menu" class="menu" aria-label="Menu utama">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.judul }}</a>
      {% endfor %}
      <a class="menu-studio" href="{{ site.studio_url }}">andu.my.id <svg class="ikon" aria-hidden="true"><use href="#i-external"/></svg></a>
    </nav>

    <div class="kepala-aksi">
      <a class="tombol-ikon" href="{{ '/cari/' | relative_url }}" aria-label="Cari tulisan"><svg class="ikon" aria-hidden="true"><use href="#i-search"/></svg></a>
      <button id="tombol-tema" class="tombol-ikon" type="button" aria-label="Ganti tema terang atau gelap">
        <svg class="ikon ikon-terang" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="ikon ikon-gelap" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button id="tombol-menu" class="tombol-ikon tombol-menu" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="menu">
        <svg class="ikon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
    </div>
  </div>
</header>
