# ============================================================
#  andu.my.id: satu situs Jekyll untuk beranda studio, aplikasi, dan blog
#  Repo: anduid/anduid.github.io  (diterbitkan lewat GitHub Actions)
# ============================================================

# ====== IDENTITAS SITUS (studio) ======
title: andu.my.id
tagline: Creative Engineering Studio
description: andu.my.id merancang dan membangun aplikasi web, sistem digitalisasi, dan otomasi untuk UMKM, instansi, dan sektor publik, berbasis di Bekasi.
lang: id
locale: id_ID
author: Andu
author_bio: Pengembang dan pendiri andu.my.id, Creative Engineering Studio di Bekasi. Menulis tentang pengembangan aplikasi, digitalisasi, dan hal yang dipelajari di lapangan.
publisher: andu.my.id
email: andhuvatamourgana@gmail.com

# Alamat situs. Tidak ada subfolder lagi: beranda di /, aplikasi di /aplikasi/, blog di /blog/.
url: "https://andu.my.id"
baseurl: ""

# ====== IDENTITAS BLOG ======
blog_title: Blog Andu
blog_seo_title: "Blog Andu | Catatan, Cerita, dan Hal yang Saya Pelajari"   # judul tab beranda blog (ideal 50-60 karakter)
blog_tagline: Catatan, cerita, dan hal yang saya pelajari
blog_description: Blog pribadi Andu berisi tulisan, catatan harian, dan pengalaman seputar teknologi dan pengembangan aplikasi.   # ideal 120-160 karakter

# Gambar bawaan untuk pratinjau media sosial (1200x630).
default_image: /assets/images/og-default.png          # halaman blog
default_image_studio: /assets/images/og-studio.png    # beranda, hub aplikasi, halaman aplikasi
twitter_username: ""                   # tanpa @, kosongkan jika tidak ada

# Tautan sosial (kosongkan jika tidak dipakai)
github_username: anduid
instagram_username: ""

# Menu navigasi (dipakai di header dan footer semua halaman bertema)
# Urutan sama dengan navbar beranda. /market/ dilayani repo anduid/market; /pesaner dan /portal/ ada di repo ini.
nav:
  - { judul: Aplikasi, url: /aplikasi/ }
  - { judul: Pesaner, url: /pesaner }
  - { judul: Market, url: /market/ }
  - { judul: Portal, url: /portal/ }
  - { judul: Blog, url: /blog/ }
  - { judul: News, url: /news/ }
  - { judul: Profil, url: /profil/ }

# Bilah ekosistem (topbar) di paling atas semua halaman, sama dengan repo anduid/market.
# kunci dipakai menandai halaman aktif (lihat _includes/topbar.html dan tools/pasang_topbar.py).
# Mengubah daftar ini lalu menjalankan: python3 tools/pasang_topbar.py  (halaman HTML mandiri ikut diperbarui).
ekosistem:
  - { nama: Studio, url: "https://andu.my.id/", kunci: studio }
  - { nama: Pesaner, url: "https://andu.my.id/pesaner", kunci: pesaner }
  - { nama: Market, url: "https://andu.my.id/market/", kunci: market }
  - { nama: Portal, url: "https://andu.my.id/portal/", kunci: portal }
  - { nama: Blog, url: "https://andu.my.id/blog/", kunci: blog }
  - { nama: News, url: "https://andu.my.id/news/", kunci: news }
  - { nama: Profil, url: "https://andu.my.id/profil/", kunci: profil }

# Menu di footer
nav_footer:
  - { judul: Andu News, url: /news/ }
  - { judul: Arsip Blog, url: /blog/arsip/ }
  - { judul: Topik Blog, url: /blog/topik/ }
  - { judul: Tentang Blog, url: /blog/tentang/ }
  - { judul: Kontak, url: /blog/kontak/ }
  - { judul: Kebijakan Privasi, url: /blog/privasi/ }

# Tag yang terlalu umum untuk dipakai mencari "tulisan terkait" otomatis
tag_abaikan: [tutorial, panduan, web]

# Google AdSense (opsional). Biarkan client kosong jika belum disetujui: tidak ada skrip/iklan yang dimuat.
adsense:
  client: "1088097367723130"        # contoh: ca-pub-1234567890123456
  slot_atas: ""     # ID unit iklan di bawah judul tulisan (angka)
  slot_tengah: ""   # ID unit iklan di tengah tulisan (butuh minimal 2 subjudul ##)
  slot_bawah: ""    # ID unit iklan di bawah tulisan

# Komentar (opsional): isi lengkap dari https://giscus.app, jika kosong komentar tidak tampil
giscus:
  repo: ""
  repo_id: ""
  category: "Announcements"
  category_id: ""

# ====== ANDU NEWS (portal berita, tampil di /news/) ======
# Berita ada di koleksi _news/ (bukan _posts/, supaya tidak bercampur dengan blog). Satu file per berita:
# _news/YYYY-MM-DD-judul.md dengan categories: [slug] dari _data/categories.yml.
news_title: ANDU NEWS
news_tagline: Berita terpercaya, belajar seru
news_description: Portal berita Indonesia dengan teman monster 3D, XP literasi, kalender baca, dan ekspor digest.
news_base: /news
# URL Web App Apps Script untuk dashboard berita (backend/andu-news-Code.gs). Kosong = mode offline (hanya IndexedDB).
# Ini deployment TERPISAH dari gas_url portal di bawah, karena daftar action-nya berbeda.
gas_webapp_url: ""

# ====== TEKNIS ======
markdown: kramdown
excerpt_separator: "<!--more-->"
timezone: Asia/Jakarta

# URL tulisan sama persis dengan yang sudah ada (https://andu.my.id/blog/TAHUN/BULAN/TANGGAL/judul/)
permalink: /blog/:year/:month/:day/:title/
paginate: 6
paginate_path: "/blog/halaman:num/"

# Hanya plugin yang diizinkan GitHub Pages. Sitemap dibuat oleh sitemap.xml buatan sendiri (lihat file itu).
plugins:
  - jekyll-feed
  - jekyll-paginate

# Alamat RSS tetap sama seperti sebelumnya: /blog/feed.xml
feed:
  path: blog/feed.xml

# Koleksi aplikasi: satu file kecil di _apps/ per aplikasi menghasilkan halaman /aplikasi/NAMA/
collections:
  apps:
    output: true
    permalink: /aplikasi/:name/
  news:
    output: true
    permalink: /news/:categories/:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: "apps" }
    values:
      layout: aplikasi
      kategori: Lainnya
      urutan: 100
      beranda: false
      bahasa: id
      schema_kategori: UtilitiesApplication
      noads: true
  - scope: { path: "", type: "news" }
    values:
      layout: news-post
      image: /assets/news/img/og-default.png

# ====== PORTAL ANDU (aplikasi, kelas, layanan) ======
# URL Web App Apps Script dari backend/Code.gs. Kosong = portal berjalan sebagai demo lokal.
gas_url: "https://script.google.com/macros/s/AKfycbyGd28EamKulsTz-vzZ-QFTE5w9f-ec75JyWc9fc8WNokzKSPHKHYOXfCsW3AOkdMVv/exec"

# Berkas yang tidak ikut diterbitkan
exclude:
  - backend
  - PANDUAN-PORTAL.md
  - README.md
  - PANDUAN-MIGRASI.md

  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - .github
