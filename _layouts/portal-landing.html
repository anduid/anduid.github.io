          },

              500: '#2A66F6', 600: '#1D5CE5', 700: '#1546BE', 800: '#143BA2', 900: '#0F2C7A', 950: '#091A4B'
            },
            amberSun: '#FFB800',
            amberSunHover: '#EAA400',
            clayBlue: '#2563EB',
            andu: {
              bg: '#174fd0',
              card: '#1546BE',
              green: '#FFB800',
              cyan: '#8EB6FF',
              purple: '#FF9B54',
              amber: '#FFB800',
              rose: '#FF8A8A'
            }
          },
          boxShadow: {
            'clay-button': '0 8px 0 #D99500, 0 14px 24px rgba(255, 184, 0, 0.42)',
            'clay-button-active': '0 2px 0 #D99500, 0 4px 10px rgba(255, 184, 0, 0.35)',
            'clay-card': '0 20px 40px -15px rgba(5, 23, 77, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4)',

<style>
    :root { color-scheme: dark; --pri: #FFB800; --sec: #8EB6FF; --ter: #FF9B54; --ink: #091A4B; }
    body {
      background-color: #174fd0;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px),
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(96, 165, 250, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(30, 58, 138, 0.7) 0%, transparent 60%),
        linear-gradient(180deg, #1f64f2 0%, #1546be 50%, #0c2d82 100%);
      background-size: 32px 32px, auto, auto, auto, auto;
      background-attachment: fixed;
      color: #D9E6FF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
    }
    body h1, body h2, body h3, body h4 { font-family: 'Fredoka', ui-rounded, sans-serif; letter-spacing: -0.01em; }

    .glass { background: rgba(19, 64, 175, 0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.18); }
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px -18px rgba(5, 23, 77, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .glass-card:hover { transform: translateY(-4px); border-color: rgba(255, 184, 0, 0.55); box-shadow: 0 25px 50px -14px rgba(5, 23, 77, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.45); }
    .glass-input { background: rgba(9, 26, 75, 0.45); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; outline: none; transition: .2s; }
    .glass-input::placeholder { color: #8EB6FF; }
    .glass-input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.28); }
    .grad { background: linear-gradient(120deg, #FFB800, #FFE58A 50%, #ffffff); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200%; animation: sh 6s linear infinite; }
    @keyframes sh { to { background-position: 200%; } }

    @keyframes fl {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      33% { transform: translateY(-18px) translateX(14px) rotate(4deg) scale(1.06); }
      66% { transform: translateY(12px) translateX(-10px) rotate(-3deg) scale(0.97); }
      100% { transform: translateY(0px) rotate(0deg) scale(1); }
    }

    /* Tombol "clay" 3D ala code.html */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 9999px; font-family: 'Fredoka', ui-rounded, sans-serif; font-weight: 700; font-size: .85rem; cursor: pointer; transition: .2s; text-align: center; }
    .btn-p { background: linear-gradient(180deg, #FCD34D 0%, #FFB800 55%, #EAB308 100%); color: var(--ink); box-shadow: 0 6px 0 #D99500, 0 12px 22px rgba(255, 184, 0, 0.38); }
    .btn-p:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 8px 0 #D99500, 0 16px 26px rgba(255, 184, 0, 0.45); }
    .btn-p:active { transform: translateY(5px); box-shadow: 0 1px 0 #D99500, 0 3px 8px rgba(255, 184, 0, 0.3); }
    .btn-o { border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .1); color: #fff; backdrop-filter: blur(8px); }
    .btn-o:hover { border-color: rgba(255, 255, 255, .45); color: var(--pri); background: rgba(255, 255, 255, .2); }
    .btn-o:active { transform: scale(.96); }
    .btn:focus-visible, .nav-btn-link:focus-visible, summary:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .cur::after { content: "▍"; animation: bk 1s steps(2) infinite; color: var(--pri); }
    @keyframes bk { 50% { opacity: 0; } }
    .bar { height: .6rem; border-radius: 9999px; background: rgba(9, 26, 75, 0.55); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .3); }
    .bar i { display: block; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #FFB800, #FFE58A); transition: width .5s; }
    details > summary { cursor: pointer; list-style: none; }
    details[open] .ch { transform: rotate(180deg); }
    .ch { transition: .3s; }
    .toast { transform: translateY(160%); transition: .45s cubic-bezier(.2, 1.3, .4, 1); }
    .toast.on { transform: none; }
    .tab { font-family: 'Fredoka', ui-rounded, sans-serif; }
    .tab.act { background: linear-gradient(180deg, #FCD34D, #FFB800); color: var(--ink); font-weight: 700; box-shadow: 0 3px 0 #D99500; }
    .eyebrow { font-family: 'Fredoka', ui-rounded, sans-serif; font-size: .8rem; letter-spacing: .04em; color: var(--pri); font-weight: 600; }

    /* SPA Page Transitions */
    .spa-page { display: none; opacity: 0; transform: translateY(16px); transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .spa-page.active { display: block; opacity: 1; transform: translateY(0); }

    .nav-btn-link { position: relative; padding: 0.4rem 0.8rem; border-radius: 9999px; transition: all 0.2s ease; cursor: pointer; }
    .nav-btn-link:hover { background: rgba(255, 255, 255, 0.15); }
    .nav-btn-link.active-link { color: #FFB800; background: rgba(255, 255, 255, 0.18); font-weight: 700; box-shadow: inset 0 1px 2px rgba(255, 255, 255, .2); }

    /* Sliding Capsule Pill Language Switcher */
    .lang-pill-track { position: relative; display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 9999px; padding: 3px; cursor: pointer; user-select: none; }
    .lang-pill-glider { position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px); background: linear-gradient(180deg, #FCD34D, #FFB800); border-radius: 9999px; box-shadow: 0 2px 0 #D99500; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
    .lang-pill-glider.id-active { transform: translateX(100%); }
    .lang-pill-opt { position: relative; z-index: 2; width: 32px; text-align: center; font-size: 11px; font-weight: 700; font-family: 'Fredoka', ui-rounded, sans-serif; padding: 3px 0; transition: color 0.2s ease; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
