<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  
  
  
  
  <meta name="theme-color" content="#070b14">

  <!-- Open Graph -->
  <meta property="og:title" content="ANDU Terminal — Developer Console & Client Portal">
  <meta property="og:description" content="Dedicated enterprise dashboard for ANDU developers and enterprise clients.">
  <meta property="og:type" content="website">

  <!-- Favicon: Official Vector Android Bugdroid Icon (Clean, No Robot Emoji) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233DDC84'%3E%3Cpath d='M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V9H6v9zm13.5-11.2l1.4-1.4c.39-.39.39-1.02 0-1.41-.39-.39-1.02-.39-1.41 0l-1.6 1.6C16.4 4.6 14.3 4 12 4s-4.4.6-5.9 1.6L4.5 4c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41l1.4 1.4C3 8.3 2 10.5 2 13h20c0-2.5-1-4.7-2.5-6.2zM7.5 9c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm9 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z'/%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            andu: {
              bg: '#070b14',
              surface: '#0d1322',
              card: 'rgba(16, 24, 40, 0.72)',
              border: 'rgba(255, 255, 255, 0.08)',
              green: '#3DDC84',
              cyan: '#38bdf8',
              purple: '#c084fc',
              amber: '#fbbf24',
              rose: '#f43f5e'
            }
          },
          animation: {
            'float': 'fl 8s ease-in-out infinite',
            'shimmer': 'sh 6s linear infinite'
          },
          keyframes: {
            fl: {
              '0%, 100%': { transform: 'translateY(0px) scale(1)' },
              '50%': { transform: 'translateY(-12px) scale(1.04) rotate(2deg)' }
            },
            sh: {
              'to': { backgroundPosition: '200% center' }
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #070b14;
      --card: #0d1322;
      --sec: #3DDC84;
      --ter: #38bdf8;
      --pri: #c084fc;
      --ln: rgba(255, 255, 255, 0.09);
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg);
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)), rgba(13, 19, 34, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ln);
    }
    .glass-input {
      background: rgba(4, 8, 16, 0.65);
      border: 1px solid var(--ln);
      color: #ffffff;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-input:focus {
      border-color: var(--sec);
      box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.2);
    }
    .grad {
      background: linear-gradient(120deg, #3DDC84, #38bdf8 50%, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200%;
      animation: sh 6s linear infinite;
    }
    @keyframes sh { to { background-position: 200% } }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.2rem;
      border-radius: 0.85rem;
      font-weight: 700;
      font-size: 0.825rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      text-align: center;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: linear-gradient(135deg, #3DDC84, #10b981);
      color: #041009;
    }
    .btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(61, 220, 132, 0.35);
    }
    .btn-outline {
      border-color: var(--ln);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
    }
    .btn-outline:hover {
      border-color: var(--sec);
      color: var(--sec);
      background: rgba(61, 220, 132, 0.08);
    }
    .btn-ghost {
      background: transparent;
      color: #94a3b8;
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }
    .bar {
      height: 0.5rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #3DDC84, #38bdf8);
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Toast slide-in */
    .toast {
      transform: translateY(-130%);
      transition: 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.active { transform: translateY(0); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(61,220,132,0.4); }
    /* Nav active indicator */
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(61, 220, 132, 0.16), rgba(61, 220, 132, 0.02));
      border-left: 3px solid #3DDC84;
      color: #ffffff;
    }
    .nav-btn.active .nav-icon {
      color: #3DDC84;
      transform: scale(1.1);
    }
    /* Tab View Animations */
    .view-content {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: none;
    }
    .view-content.active {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }
  </style>

{% include portal-meta.html %}
<meta name="robots" content="noindex,nofollow">
{% include portal-config.html %}
</head>
<body class="flex flex-col h-screen selection:bg-andu-green selection:text-andu-bg">
{{ content }}
<script src="{{ '/assets/portal/andu-core.js' | relative_url }}"></script>
<script src="{{ '/assets/portal/terminal-api.js' | relative_url }}"></script>
<script src="{{ '/assets/portal/terminal.js' | relative_url }}"></script>
</body>
</html>
