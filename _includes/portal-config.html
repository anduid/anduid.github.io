<script>
window.ANDU = {
  gas: {{ site.gas_url | jsonify }},
  site: {{ site.url | jsonify }},
  catalog: {{ site.data.katalog | jsonify }},
  posts: [{% for p in site.posts limit: 12 %}{"slug": {{ p.slug | jsonify }}, "title": {{ p.title | jsonify }}, "url": {{ p.url | relative_url | jsonify }}, "date": {{ p.date | date: "%Y-%m-%d" | jsonify }}, "tags": {{ p.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
};
</script>
